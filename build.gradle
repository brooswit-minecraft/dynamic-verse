plugins {
    id "net.neoforged.moddev" version "2.0.146"
}

group = "io.github.brooswitminecraft"
version = "0.0.1-feasibility"

base {
    archivesName = "dynamic-verse"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    // This run keeps the provider as an ordinary runtime mod dependency rather
    // than a legacy-only classpath library; main still owns the fixture classes.
    providerBridgeGameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
        // Retain the complete NeoForge/FML launch closure from main while
        // preserving this source set's provider-only runtime dependencies.
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

neoForge {
    // Pinned to DynamicDimensions' minecraft/1.21 source declaration.
    version = "21.1.148"

    mods {
        dynamicverse {
            sourceSet sourceSets.main
            sourceSet sourceSets.test
        }
    }

    unitTest {
        enable()
        testedMod = mods.dynamicverse
    }

    // Source-only preparation for the serialized GameTest server validation gate.
    runs {
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file("run/gametest")
            // The travel fixture uses the pinned vanilla empty template; bridge fixtures register separately.
            systemProperty "neoforge.enabledGameTestNamespaces", "minecraft"
        }
    }
    runs {
        register("bridgeGameTest") {
            type = "gameTestServer"
            // Isolated disposable run state; do not point this at an existing world.
            gameDirectory = layout.projectDirectory.dir("run/bridgeGameTest-controlled-observation-minecraft")
            // Test output carries the compiled facade cases and its main runtime
            // dependency; the dynamicverse mod mapping below includes both outputs.
            sourceSet = sourceSets.test
            // Explicit template namespaces override @GameTestHolder, so include
            // both the Dynamic Verse and vanilla-template controlled fixtures.
            systemProperty "neoforge.enabledGameTestNamespaces", "dynamicverse,minecraft"
        }
        register("providerBridgeGameTest") {
            type = "gameTestServer"
            // Reserved fresh root for the reviewed top-level-save-adapter candidate; never reuse a prior root.
            gameDirectory = layout.projectDirectory.dir("run/providerBridgeGameTest-destination-load-integration")
            sourceSet = sourceSets.providerBridgeGameTest
            systemProperty "neoforge.enabledGameTestNamespaces", "dynamicverse"
            systemProperty "dynamicverse.providerBridgeIntegration", "true"
        }
    }
}

repositories {
    mavenCentral()
    maven { url = "https://maven.bai.lol" }
}

def dynamicDimensionsJar = layout.projectDirectory.file("local-artifacts/dynamicdimensions-neoforge.jar")
// Must be built from reviewed provider candidate 4b09389; do not substitute the preserved older artifact.
def acceptedDynamicDimensionsJar = file("/tmp/dynamicdimensions-composite/neoforge/build/libs/dynamicdimensions-neoforge-0.10.0+4b09389e-dirty.jar")
// 4b09389 classes include the reviewed top-level save adapter; older artifacts intentionally remain untouched.
def reviewedDynamicDimensionsClasses = file("/tmp/dynamicdimensions-composite/neoforge/build/classes/java/main")
def dynamicDimensionsSha256 = "b25aefb589ae1c8635679373230d536c6c77bd21942f65d0f9765436e5046d79"

dependencies {
    // Compile against the reviewed, pinned provider API; it is never bundled or published by this fixture.
    compileOnly files(reviewedDynamicDimensionsClasses)
    // Controlled facade GameTests construct the production descriptor.
    testCompileOnly files(reviewedDynamicDimensionsClasses)
    // Plain JUnit discovery must load that descriptor's API signature. This is
    // an ordinary test-worker classpath entry, not a NeoForge runtime mod or run source set.
    testRuntimeOnly files(reviewedDynamicDimensionsClasses)
    // Already pinned by the NeoForge/Minecraft toolchain; needed by the no-server Brigadier JUnit harness.
    testImplementation "com.mojang:brigadier:1.3.10"
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    bridgeGameTestAdditionalRuntimeClasspath files(reviewedDynamicDimensionsClasses)
    // The selected provider runtime source set exposes these as ordinary run
    // dependencies so NeoForge discovers their mod metadata and mixins.
    providerBridgeGameTestRuntimeOnly files(acceptedDynamicDimensionsJar)
    providerBridgeGameTestRuntimeOnly "lol.bai:badpackets:neo-0.8.2"
}

tasks.register("verifyLocalDynamicDimensionsArtifact") {
    group = "verification"
    description = "Verifies the disposable pinned DynamicDimensions jar used by the feasibility probe."
    inputs.file(dynamicDimensionsJar)
    doLast {
        File artifact = dynamicDimensionsJar.asFile
        if (!artifact.isFile()) throw new GradleException("Missing local DynamicDimensions artifact: " + artifact)
        def digest = java.security.MessageDigest.getInstance("SHA-256")
        artifact.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            for (int read; (read = stream.read(buffer)) != -1;) digest.update(buffer, 0, read)
        }
        def actual = digest.digest().collect { String.format("%02x", it) }.join()
        if (actual != dynamicDimensionsSha256) throw new GradleException("Unexpected DynamicDimensions SHA-256: " + actual)
    }
}

test {
    useJUnitPlatform()
}
