plugins {
    id "net.neoforged.moddev" version "2.0.146"
}

group = "io.github.brooswitminecraft"
version = "0.0.1-feasibility"

base {
    archivesName = "dynamic-verse"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    // Pinned to DynamicDimensions' minecraft/1.21 source declaration.
    version = "21.1.148"

    mods {
        dynamicverse {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

def dynamicDimensionsJar = layout.projectDirectory.file("local-artifacts/dynamicdimensions-neoforge.jar")
// 04341e14 classes include the reviewed close API; the older local jar intentionally remains untouched.
def reviewedDynamicDimensionsClasses = file("/tmp/dynamicdimensions-composite/neoforge/build/classes/java/main")
def dynamicDimensionsSha256 = "b25aefb589ae1c8635679373230d536c6c77bd21942f65d0f9765436e5046d79"

dependencies {
    // Compile against the reviewed, pinned provider API; it is never bundled or published by this fixture.
    compileOnly files(reviewedDynamicDimensionsClasses)
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.register("verifyLocalDynamicDimensionsArtifact") {
    group = "verification"
    description = "Verifies the disposable pinned DynamicDimensions jar used by the feasibility probe."
    inputs.file(dynamicDimensionsJar)
    doLast {
        File artifact = dynamicDimensionsJar.asFile
        if (!artifact.isFile()) throw new GradleException("Missing local DynamicDimensions artifact: " + artifact)
        def digest = java.security.MessageDigest.getInstance("SHA-256")
        artifact.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            for (int read; (read = stream.read(buffer)) != -1;) digest.update(buffer, 0, read)
        }
        def actual = digest.digest().collect { String.format("%02x", it) }.join()
        if (actual != dynamicDimensionsSha256) throw new GradleException("Unexpected DynamicDimensions SHA-256: " + actual)
    }
}

test {
    useJUnitPlatform()
}
